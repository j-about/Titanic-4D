name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build, budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm budgets

  e2e:
    name: End-to-end, accessibility and visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/e2e-container.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container image, headers, redirects and scene under the production policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build the image
        run: docker build --tag titanic-4d:ci .
      - name: Start the container
        run: docker run --detach --name titanic-4d --publish 8080:8080 titanic-4d:ci
      - name: Wait for the health check
        run: |
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' titanic-4d)"
            if [ "${status}" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs titanic-4d
          exit 1
      - name: Verify headers, caching, fallbacks and host redirects
        run: node tools/verify-server.ts --origin http://127.0.0.1:8080
      - name: Verify the container runs unprivileged
        run: test "$(docker exec titanic-4d id -u)" != "0"
      - name: Run the scene and accessibility tests under the production content security policy
        run: tools/e2e-container.sh scene.spec.ts home.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-container
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ always() }}
        run: docker rm --force titanic-4d
