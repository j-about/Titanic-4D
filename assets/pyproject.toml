[project]
name = "titanic-assets"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bpy==5.3.0",
    "numpy==2.5.4",
]

[project.scripts]
titanic-assets = "titanic_assets:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "ty==0.0.104",
]
